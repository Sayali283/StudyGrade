{% extends 'base.html' %}

{% block content %}

<div class="container signup-shell">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card-box signup-card">
                <p class="text-uppercase fw-bold text-success small mb-2">Student account</p>
                <h1 class="h2 mb-4">Start your study space</h1>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-warning">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label" for="student-name">Full name</label>
                <input class="form-control" id="student-name" type="text" name="name" placeholder="Enter full name" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="student-email">Email address</label>
                <input class="form-control" id="student-email" type="email" name="email" placeholder="Enter email" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="student-password">Password</label>
                <input class="form-control" id="student-password" type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>

            <div class="mb-4">
                <label class="form-label" for="class-semester">Class / semester</label>
                <input class="form-control" id="class-semester" type="text" name="class_semester" placeholder="Example: BCA Sem 5" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Create student account <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></button>

        </form>

        <div class="text-center mt-4 small text-secondary">
            Already have an account?
            <a class="fw-bold text-success" href="{% url 'login' %}">Log in</a>
        </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
