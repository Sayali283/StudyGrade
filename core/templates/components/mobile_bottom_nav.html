{% load static %}
<!-- Mobile Bottom Navigation Bar (App-style navigation for thumb ergonomic reach) -->
<nav class="mobile-bottom-nav d-md-none" aria-label="Mobile Navigation">
    <a href="{% url 'student_dashboard' %}" class="mobile-nav-item {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}">
        <i class="bi bi-grid-fill" aria-hidden="true"></i>
        <span>HQ</span>
    </a>
    <a href="{% url 'student_notes' %}" class="mobile-nav-item {% if 'notes' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-journal-text" aria-hidden="true"></i>
        <span>Notes</span>
    </a>
    <a href="{% url 'quiz_home' %}" class="mobile-nav-item {% if 'quiz' in request.resolver_match.url_name or 'flashcard' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-patch-question-fill" aria-hidden="true"></i>
        <span>Quizzes</span>
    </a>
    <a href="{% url 'pomodoro_timer' %}" class="mobile-nav-item {% if 'pomodoro' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-stopwatch-fill" aria-hidden="true"></i>
        <span>Focus</span>
    </a>
    <a href="{% url 'student_progress' %}" class="mobile-nav-item {% if 'progress' in request.resolver_match.url_name %}active{% endif %}">
        <i class="bi bi-graph-up" aria-hidden="true"></i>
        <span>Stats</span>
    </a>
</nav>
