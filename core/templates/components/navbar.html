{% load static %}
<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark site-nav">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'images/logo.svg' %}" alt="Study Guard Logo" class="brand-mark-img">
                <span>Study<span style="color: var(--ember-500);">Guard</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavigation" aria-controls="siteNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="siteNavigation">
                <div class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        {% if user.student %}
                            <span class="nav-role-badge me-lg-2">Student</span>
                            <a class="nav-link {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}" href="{% url 'student_dashboard' %}">
                                <i class="bi bi-grid-fill me-1" aria-hidden="true"></i> Dashboard
                            </a>
                            <a class="nav-link {% if 'notes' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'student_notes' %}">
                                <i class="bi bi-journal-text me-1" aria-hidden="true"></i> Notes
                            </a>
                            <a class="nav-link {% if 'quiz' in request.resolver_match.url_name and 'retry' not in request.resolver_match.url_name %}active{% endif %}" href="{% url 'quiz_home' %}">
                                <i class="bi bi-patch-question me-1" aria-hidden="true"></i> Quiz
                            </a>
                            <a class="nav-link {% if 'mistake' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'mistake_notebook' %}">
                                <i class="bi bi-journal-x me-1" aria-hidden="true"></i> Mistakes
                            </a>
                            <a class="nav-link {% if 'revision' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'revision_today' %}">
                                <i class="bi bi-calendar2-check me-1" aria-hidden="true"></i> Revision
                            </a>
                            <a class="nav-link {% if 'flashcard' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'flashcard_home' %}">
                                <i class="bi bi-stack me-1" aria-hidden="true"></i> Flashcards
                            </a>
                            <a class="nav-link {% if 'pomodoro' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'pomodoro_timer' %}">
                                <i class="bi bi-stopwatch me-1" aria-hidden="true"></i> Pomodoro
                            </a>
                            <a class="nav-link {% if 'progress' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'student_progress' %}">
                                <i class="bi bi-graph-up me-1" aria-hidden="true"></i> Progress
                            </a>
                        {% elif user.parent %}
                            <span class="nav-role-badge me-lg-2">Parent</span>
                            <a class="nav-link {% if request.resolver_match.url_name == 'parent_dashboard' %}active{% endif %}" href="{% url 'parent_dashboard' %}">
                                <i class="bi bi-grid-fill me-1" aria-hidden="true"></i> Dashboard
                            </a>
                        {% endif %}
                        <a class="nav-link text-danger ms-lg-2" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i> Log out
                        </a>
                    {% else %}
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'login' %}active{% endif %}" href="{% url 'login' %}">Log in</a>
                        <a class="nav-link {% if request.resolver_match.url_name == 'parent_signup' %}active{% endif %}" href="{% url 'parent_signup' %}">For parents</a>
                        <a class="nav-link nav-cta ms-lg-2" href="{% url 'student_signup' %}">
                            Get started <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
                        </a>
                    {% endif %}

                    <!-- Theme Switcher Button -->
                    <button id="theme-toggle" class="theme-toggle-btn ms-lg-2" aria-label="Toggle dark/light theme" type="button" title="Toggle theme">
                        <i class="bi bi-sun-fill" id="theme-toggle-icon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</header>
