<div class="col-md-2 mb-4 d-none d-md-block">
    <div class="card-box p-3">
        <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom border-subtle">
            <span style="color: var(--ember-500);"><i class="bi bi-compass"></i></span>
            <span class="stat-label mb-0">Navigation</span>
        </div>
        <div class="d-grid gap-2">
            <a href="{% url 'student_dashboard' %}" class="btn {% if request.resolver_match.url_name == 'student_dashboard' %}btn-primary{% else %}btn-outline-dark{% endif %} text-start">
                <i class="bi bi-grid-fill me-2" aria-hidden="true"></i> Dashboard
            </a>
            <a href="{% url 'student_notes' %}" class="btn {% if 'notes' in request.resolver_match.url_name %}btn-primary{% else %}btn-outline-dark{% endif %} text-start">
                <i class="bi bi-journal-text me-2" aria-hidden="true"></i> Notes
            </a>
            <a href="{% url 'quiz_home' %}" class="btn {% if 'quiz' in request.resolver_match.url_name %}btn-primary{% else %}btn-outline-dark{% endif %} text-start">
                <i class="bi bi-patch-question me-2" aria-hidden="true"></i> Quiz Center
            </a>
            <a href="{% url 'flashcard_home' %}" class="btn {% if 'flashcard' in request.resolver_match.url_name %}btn-primary{% else %}btn-outline-dark{% endif %} text-start">
                <i class="bi bi-stack me-2" aria-hidden="true"></i> Flashcards
            </a>
            <a href="{% url 'pomodoro_timer' %}" class="btn {% if 'pomodoro' in request.resolver_match.url_name %}btn-primary{% else %}btn-outline-dark{% endif %} text-start">
                <i class="bi bi-stopwatch me-2" aria-hidden="true"></i> Pomodoro
            </a>
            <a href="{% url 'student_progress' %}" class="btn {% if request.resolver_match.url_name == 'student_progress' %}btn-primary{% else %}btn-outline-dark{% endif %} text-start">
                <i class="bi bi-graph-up me-2" aria-hidden="true"></i> Progress
            </a>
            <hr class="my-2 border-subtle">
            <a href="{% url 'logout' %}" class="btn btn-outline-danger text-start">
                <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i> Logout
            </a>
        </div>
    </div>
</div>
