<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f2">
    <title>Study Guard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            color-scheme: light;
            --ink: #1f382f;
            --muted: #66776f;
            --canvas: #f4f6f2;
            --surface: #ffffff;
            --green: #28745b;
            --green-dark: #1c5845;
            --coral: #ca674e;
            --sky: #477b91;
            --line: #e1e8e2;
            --soft-green: #eaf2ed;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 { color: var(--ink); }
        h1, .display-heading { font-family: 'DM Serif Display', Georgia, serif; }

        .site-header {
            position: relative;
            z-index: 5;
            background: rgba(255, 255, 255, .94);
            border-bottom: 1px solid var(--line);
        }

        .site-nav { min-height: 74px; }
        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink) !important;
            font-size: 19px;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 9px;
            background: var(--green);
            color: #fff;
            font-size: 19px;
        }

        .navbar-nav { align-items: center; gap: 6px; }
        .nav-link {
            padding: 9px 13px !important;
            border-radius: 5px;
            color: var(--muted) !important;
            font-size: 14px;
            font-weight: 600;
            transition: background-color .2s ease, color .2s ease;
        }

        .nav-link:hover, .nav-link:focus-visible {
            background: var(--soft-green);
            color: var(--green-dark) !important;
        }

        .nav-cta { background: var(--green); color: #fff !important; }
        .nav-cta:hover, .nav-cta:focus-visible { background: var(--green-dark); color: #fff !important; }
        .navbar-toggler { border-color: var(--line); }
        .navbar-toggler:focus { box-shadow: 0 0 0 .2rem rgba(40, 116, 91, .15); }

        .main-container {
            width: min(1280px, calc(100% - 48px));
            margin-inline: auto;
            padding: 42px 0 72px;
        }

        .card-box {
            height: 100%;
            padding: 25px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(31, 56, 47, .045);
        }

        .dashboard-title {
            margin-bottom: 24px;
            font-family: 'DM Serif Display', Georgia, serif;
            font-size: 34px;
        }

        .stat-number { color: var(--green-dark); font-size: 36px; font-weight: 700; line-height: 1.2; }
        .btn {
            min-height: 42px;
            padding: 9px 16px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 700;
            transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn-primary, .btn-success { border-color: var(--green); background: var(--green); color: #fff; }
        .btn-primary:hover, .btn-primary:focus, .btn-success:hover, .btn-success:focus {
            border-color: var(--green-dark);
            background: var(--green-dark);
            color: #fff;
        }

        .btn-dark { border-color: var(--ink); background: var(--ink); }
        .btn-outline-primary, .btn-outline-success { border-color: var(--green); color: var(--green-dark); }
        .btn-outline-primary:hover, .btn-outline-success:hover { border-color: var(--green); background: var(--green); color: #fff; }
        .btn-outline-dark { border-color: #b7c4bc; color: var(--ink); }
        .btn-outline-danger { border-color: #d89a89; color: #a94f3c; }
        .form-label { color: var(--ink); font-size: 14px; font-weight: 700; }
        .form-control, .form-select {
            min-height: 46px;
            border: 1px solid #d6e0d9;
            border-radius: 5px;
            background-color: #fbfcfa;
            color: var(--ink);
            font-size: 14px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--green);
            background: #fff;
            box-shadow: 0 0 0 .2rem rgba(40, 116, 91, .12);
        }

        .form-check-input:checked { border-color: var(--green); background-color: var(--green); }
        .text-primary, .text-success { color: var(--green) !important; }
        .text-info { color: var(--sky) !important; }
        .badge.bg-primary, .badge.bg-success { background-color: var(--green) !important; }
        .table { --bs-table-color: var(--ink); --bs-table-hover-bg: #f5f8f5; }
        .table > :not(caption) > * > * { padding: 13px 12px; border-bottom-color: var(--line); }
        .table thead th { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .list-group-item { border-color: var(--line); }
        .alert { border-radius: 5px; font-size: 14px; }
        .site-footer { padding: 20px 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; }

        @media (max-width: 991.98px) {
            .navbar-nav { align-items: stretch; padding: 12px 0 16px; }
            .navbar-nav .nav-link { padding-inline: 12px !important; }
            .nav-cta { margin-top: 4px; }
        }

        @media (max-width: 575.98px) {
            .main-container { width: calc(100% - 32px); padding: 28px 0 48px; }
            .card-box { padding: 20px; }
            .dashboard-title { font-size: 29px; }
        }
    </style>
</head>
<body>
<header class="site-header">
    <nav class="navbar navbar-expand-lg site-nav">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <span class="brand-mark"><i class="bi bi-book-half" aria-hidden="true"></i></span>
                <span>Study Guard</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavigation" aria-controls="siteNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="siteNavigation">
                <div class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        {% if user.student %}
                            <a class="nav-link" href="{% url 'student_dashboard' %}">Dashboard</a>
                        {% elif user.parent %}
                            <a class="nav-link" href="{% url 'parent_dashboard' %}">Dashboard</a>
                        {% endif %}
                        <a class="nav-link" href="{% url 'logout' %}">Log out</a>
                    {% else %}
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                        <a class="nav-link" href="{% url 'login' %}">Log in</a>
                        <a class="nav-link" href="{% url 'parent_signup' %}">For parents</a>
                        <a class="nav-link nav-cta" href="{% url 'student_signup' %}">Get started</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
</header>
<main class="main-container">
    {% block content %}
    {% endblock %}
 </main>
<footer class="site-footer">Study Guard <span aria-hidden="true">·</span> Learn steadily. See your progress.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
