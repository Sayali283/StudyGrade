<!DOCTYPE html>
<html lang="en">
<head>

    <title>Server Error · Study Guard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f2; color: #1f382f; min-height: 100vh; display: grid; place-items: center; }

<body>
    <div class="card-box">
        <div class="display-1 text-danger fw-bold mb-3">500</div>
