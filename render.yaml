services:
  - type: web
    name: studygrade
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn smartstudy.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: studygrade-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: studygrade-postgres
    plan: free
    databaseName: studygrade_db
    user: studygrade_user
