services:
  - type: web
    name: studygrade
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate"
    startCommand: "gunicorn smartstudy.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "studygrade.onrender.com,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://studygrade.onrender.com,https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: studygrade-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "10485760"
      - key: MAX_USER_STORAGE_BYTES
        value: "52428800"

databases:
  - name: studygrade-postgres
    plan: free
    databaseName: studygrade_db
    user: studygrade_user
